[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "octo-ai"
version = "0.1.0"
description = "A Python coding agent with persistent sessions and extensible tools."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "anyio>=4.0",
    "fastapi>=0.115",
    "httpx[socks]>=0.27",
    "packaging>=24.0",
    "pillow>=11.0",
    "pydantic>=2.11",
    "pygments>=2.18",
    "rich>=13.0",
    "textual>=8.2.8",
    "typer>=0.12",
    "uvicorn>=0.30",
]

# Python tests use the standard-library unittest runner and packages already
# listed in [project] dependencies (for example httpx and typer). There are
# no extra test-only Python packages.
[project.optional-dependencies]
dev = []
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
octo = "terminal_app.cli:app"
octo-web = "web_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_core*", "model_adapters*", "long_term_memory*", "terminal_app*", "web_api*"]
namespaces = false

[tool.setuptools.package-data]
terminal_app = ["data/*.toml", "data/*.json", "tui/themes/*.json"]
